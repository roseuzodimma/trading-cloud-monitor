<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Cloud Monitor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #070b12;
      color: #e8edf5;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 18px;
    }

    /* HEADER */
    .header {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .brand p {
      color: #7f8da3;
      font-size: 13px;
    }

    .system-status {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 9px 13px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #273548;
      background: #111a27;
    }

    .pill.online {
      color: #39e58c;
      border-color: #1b7549;
    }

    .pill.offline {
      color: #ff5d68;
      border-color: #81333b;
    }

    .pill.open {
      color: #39e58c;
      border-color: #1b7549;
    }

    .pill.closed {
      color: #ffbd4a;
      border-color: #795b22;
    }

    /* SUMMARY */
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 14px;
      padding: 16px;
    }

    .summary-card .label {
      color: #7f8da3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .summary-card .value {
      font-size: 20px;
      font-weight: bold;
    }

    /* NEWS PROTECTION */
    .news-panel {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .news-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .news-title {
      font-size: 16px;
      font-weight: bold;
    }

    .news-source {
      color: #7f8da3;
      font-size: 11px;
    }

    .news-status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #465263;
      background: #111a27;
    }

    .news-clear {
      color: #39e58c;
      border-color: #1b7549;
    }

    .news-before,
    .news-after,
    .news-settling {
      color: #ffbd4a;
      border-color: #795b22;
    }

    .news-event {
      background: #111a27;
      border: 1px solid #202d3e;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      line-height: 1.6;
    }

    .news-event strong {
      color: #ffffff;
    }

    .news-event .muted {
      color: #7f8da3;
    }

    /* CONTROLS */
    .controls {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .control-title {
      font-weight: bold;
    }

    .control-subtitle {
      color: #7f8da3;
      font-size: 12px;
      margin-top: 4px;
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .switch {
      position: relative;
      width: 54px;
      height: 29px;
      display: inline-block;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #273243;
      border-radius: 30px;
      cursor: pointer;
      transition: .25s;
    }

    .slider:before {
      content: "";
      position: absolute;
      width: 21px;
      height: 21px;
      left: 4px;
      top: 4px;
      background: white;
      border-radius: 50%;
      transition: .25s;
    }

    input:checked + .slider {
      background: #16a765;
    }

    input:checked + .slider:before {
      transform: translateX(25px);
    }

    #alertStatus {
      font-size: 12px;
      font-weight: bold;
    }

    /* PAIRS */
    .section-title {
      font-size: 18px;
      margin: 20px 0 12px;
    }

    .pairs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .pair-card {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 16px;
      overflow: hidden;
    }

    .pair-header {
      padding: 17px;
      border-bottom: 1px solid #1d2938;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .pair-name {
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
    }

    .status.buy {
      background: rgba(23, 180, 105, .15);
      color: #39e58c;
      border: 1px solid #1b7549;
    }

    .status.sell {
      background: rgba(239, 70, 81, .15);
      color: #ff6670;
      border: 1px solid #81333b;
    }

    .status.wait {
      background: rgba(255, 189, 74, .12);
      color: #ffbd4a;
      border: 1px solid #795b22;
    }

    .status.offline {
      background: rgba(127, 141, 163, .12);
      color: #9ba7b8;
      border: 1px solid #465263;
    }

    .pair-body {
      padding: 17px;
    }

    .price-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .price-box {
      background: #111a27;
      border: 1px solid #202d3e;
      border-radius: 10px;
      padding: 11px;
    }

    .price-box span {
      display: block;
      color: #7f8da3;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .price-box strong {
      font-size: 14px;
      word-break: break-word;
    }

    .price-main {
      color: #ffffff;
      font-size: 18px !important;
    }

    .sl {
      color: #ff6670;
    }

    .tp {
      color: #39e58c;
    }

    /* SCORE */
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      background: #111a27;
      border-radius: 10px;
      padding: 12px;
    }

    .score-label {
      color: #8b98aa;
      font-size: 12px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
    }

    .score-high {
      color: #39e58c;
    }

    .score-medium {
      color: #ffbd4a;
    }

    .score-low {
      color: #ff6670;
    }

    /* TIMEFRAMES */
    .timeframes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 15px;
    }

    .tf {
      background: #111a27;
      border: 1px solid #202d3e;
      border-radius: 10px;
      padding: 12px;
    }

    .tf-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .tf-trend {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .tf-rsi {
      color: #8996a8;
      font-size: 11px;
    }

    .bullish {
      color: #39e58c;
    }

    .bearish {
      color: #ff6670;
    }

    .neutral {
      color: #ffbd4a;
    }

    /* ANALYSIS */
    .analysis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .analysis-item {
      background: #111a27;
      border-radius: 9px;
      padding: 10px;
      border: 1px solid #202d3e;
    }

    .analysis-item .label {
      color: #748197;
      font-size: 10px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .analysis-item .value {
      font-size: 12px;
      font-weight: bold;
      word-break: break-word;
    }

    /* NEWS / SMC SETUP */
    .setup-panel {
      background: #101824;
      border: 1px solid #202d3e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
    }

    .setup-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .setup-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .setup-item {
      background: #111a27;
      border-radius: 8px;
      padding: 9px;
      border: 1px solid #202d3e;
    }

    .setup-item span {
      display: block;
      color: #748197;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .setup-item strong {
      font-size: 11px;
    }

    .confirmed {
      color: #39e58c;
    }

    .not-confirmed {
      color: #ffbd4a;
    }

    /* MESSAGE */
    .message {
      background: #101824;
      border-left: 3px solid #49627f;
      border-radius: 7px;
      padding: 11px;
      color: #b8c3d2;
      font-size: 12px;
      line-height: 1.5;
    }

    /* API / PERFORMANCE */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .panel {
      background: #0d131d;
      border: 1px solid #1d2938;
      border-radius: 14px;
      padding: 17px;
    }

    .panel h3 {
      margin-bottom: 14px;
      font-size: 16px;
    }

      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 9px 0;
      border-bottom: 1px solid #182331;
      font-size: 12px;
    }

    .info-row:last-child {
      border-bottom: none;
    }
