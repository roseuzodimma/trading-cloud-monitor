<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Trading Cloud Monitor</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #f8fafc;
    }

    header {
      padding: 20px;
      background: #111827;
      border-bottom: 1px solid #243044;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      color: #94a3b8;
      font-size: 13px;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 15px;
      max-width: 1400px;
      margin: auto;
    }

    .stat {
      background: #111827;
      border: 1px solid #243044;
      border-radius: 12px;
      padding: 15px;
    }

    .stat-title {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
    }

    .dashboard {
      max-width: 1400px;
      margin: auto;
      padding: 0 15px 30px;
    }

    .pair-card {
      background: #111827;
      border: 1px solid #243044;
      border-radius: 14px;
      margin-top: 15px;
      overflow: hidden;
    }

    .pair-header {
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #243044;
    }

    .pair-name {
      font-size: 22px;
      font-weight: bold;
    }

    .status {
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-buy {
      background: #064e3b;
      color: #6ee7b7;
    }

    .status-sell {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .status-wait {
      background: #334155;
      color: #cbd5e1;
    }

    .status-offline {
      background: #451a03;
      color: #fdba74;
    }

    .price-box {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .price-item {
      background: #0b1120;
      padding: 13px;
      border-radius: 10px;
    }

    .price-label {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .price-value {
      font-size: 17px;
      font-weight: bold;
    }

    .green {
      color: #34d399;
    }

    .red {
      color: #f87171;
    }

    .yellow {
      color: #fbbf24;
    }

    .blue {
      color: #60a5fa;
    }

    .section {
      padding: 18px;
      border-top: 1px solid #243044;
    }

    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #e2e8f0;
    }

    .timeframes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tf {
      background: #0b1120;
      border-radius: 10px;
      padding: 14px;
    }

    .tf-name {
      font-weight: bold;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    .tf-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .analysis-item {
      background: #0b1120;
      padding: 12px;
      border-radius: 10px;
    }

    .analysis-label {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .analysis-value {
      font-size: 13px;
      font-weight: bold;
    }

    .message {
      padding: 15px 18px;
      color: #cbd5e1;
      font-size: 13px;
      border-top: 1px solid #243044;
    }

    .score {
      font-size: 20px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 12px;
    }

    .alert-control {
      max-width: 1400px;
      margin: 15px auto 0;
      padding: 0 15px;
    }

    .alert-box {
      background: #111827;
      border: 1px solid #243044;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .toggle-on {
      background: #065f46;
      color: white;
    }

    .toggle-off {
      background: #7f1d1d;
      color: white;
    }

    .error {
      color: #f87171;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .price-box {
        grid-template-columns: repeat(2, 1fr);
      }

      .analysis-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      .topbar {
        grid-template-columns: 1fr 1fr;
      }

      .price-box {
        grid-template-columns: 1fr 1fr;
      }

      .timeframes {
        grid-template-columns: 1fr;
      }

      .analysis-grid {
        grid-template-columns: 1fr 1fr;
      }

      .pair-name {
        font-size: 18px;
      }
    }
  </style></head><body><header>
  <h1>📊 Trading Cloud Monitor</h1>
  <p>12H + 1H + 5M • SMC • RSI • Breakout • Rejection</p>
</header><div class="topbar">  <div class="stat">
    <div class="stat-title">SYSTEM</div>
    <div id="systemStatus" class="stat-value">Loading...</div>
  </div>  <div class="stat">
    <div class="stat-title">MARKET</div>
    <div id="marketStatus" class="stat-value">Loading...</div>
  </div>  <div class="stat">
    <div class="stat-title">LAST SCAN</div>
    <div id="lastScan" class="stat-value">—</div>
  </div>  <div class="stat">
    <div class="stat-title">API</div>
    <div id="apiStatus" class="stat-value">Loading...</div>
  </div></div><div class="alert-control">  <div class="alert-box"><div>
  <strong>🔔 Telegram Alerts</strong>
  <div id="alertText" style="font-size:12px;color:#94a3b8;margin-top:5px;">
    Checking...
  </div>
</div>

<button
  id="alertButton"
  class="toggle"
  onclick="toggleAlerts()">
  Loading...
</button>

  </div></div><main id="dashboard" class="dashboard">  <div style="text-align:center;padding:40px;color:#94a3b8;">
    Loading market data...
  </div></main><div class="footer">
  Trading Cloud Monitor • Automatic market monitoring
</div><script>

let currentAlerts = true;

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "—";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function statusClass(status) {

  if (status === "BUY") {
    return "status-buy";
  }

  if (status === "SELL") {
    return "status-sell";
  }

  if (status === "OFFLINE") {
    return "status-offline";
  }

  return "status-wait";
}

function trendClass(trend) {

  if (trend === "BULLISH") {
    return "green";
  }

  if (trend === "BEARISH") {
    return "red";
  }

  return "yellow";
}

function formatTime(value) {

  if (!value) {
    return "—";
  }

  try {

    return new Date(value)
      .toLocaleString();

  } catch (e) {

    return value;
  }
}

function valueOrDash(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }

  return escapeHtml(value);
}

function renderPair(pair) {

  const h12 =
    pair.timeframes &&
    pair.timeframes.h12
      ? pair.timeframes.h12
      : {};

  const h1 =
    pair.timeframes &&
    pair.timeframes.h1
      ? pair.timeframes.h1
      : {};

  const m5 =
    pair.timeframes &&
    pair.timeframes.m5
      ? pair.timeframes.m5
      : {};

  const analysis =
    pair.analysis || {};

  const status =
    pair.status || "WAIT";

  return `

    <div class="pair-card">

      <div class="pair-header">

        <div>

          <div class="pair-name">
            ${escapeHtml(pair.symbol)}
          </div>

          <div style="font-size:12px;color:#64748b;margin-top:4px;">
            Updated:
            ${formatTime(pair.updated)}
          </div>

        </div>

        <div class="status ${statusClass(status)}">
          ${escapeHtml(status)}
        </div>

      </div>


      <div class="price-box">

        <div class="price-item">

          <div class="price-label">
            CURRENT PRICE
          </div>

          <div class="price-value blue">
            ${valueOrDash(pair.price)}
          </div>

        </div>


        <div class="price-item">

          <div class="price-label">
            ENTRY
          </div>

          <div class="price-value">
            ${valueOrDash(pair.entry)}
          </div>

        </div>


        <div class="price-item">

          <div class="price-label">
            STOP LOSS
          </div>

          <div class="price-value red">
            ${valueOrDash(pair.stopLoss)}
          </div>

        </div>


        <div class="price-item">

          <div class="price-label">
            TAKE PROFIT
          </div>

          <div class="price-value green">
            ${valueOrDash(pair.takeProfit)}
          </div>

        </div>


      </div>


      <div class="section">

        <div class="section-title">
          SIGNAL QUALITY
        </div>

        <div style="display:flex;align-items:center;gap:15px;">

          <div class="score">
            ⭐ ${valueOrDash(pair.score)}/5
          </div>

          <div style="color:#94a3b8;font-size:13px;">
            ${escapeHtml(pair.message || "—")}
          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          MULTI-TIMEFRAME CONFIRMATION
        </div>

        <div class="timeframes">


          <div class="tf">

            <div class="tf-name">
              📊 12H
            </div>

            <div class="tf-row">
              <span>Trend</span>
              <strong class="${trendClass(h12.trend)}">
                ${valueOrDash(h12.trend)}
              </strong>
            </div>

            <div class="tf-row">
              <span>RSI</span>
              <strong>
                ${valueOrDash(h12.rsi)}
              </strong>
            </div>

            <div class="tf-row">
              <span>Previous</span>
              <strong class="${trendClass(h12.previous)}">
                ${valueOrDash(h12.previous)}
              </strong>
            </div>

            <div class="tf-row">
              <span>Current</span>
              <strong class="${trendClass(h12.current)}">
                ${valueOrDash(h12.current)}
              </strong>
            </div>

          </div>


          <div class="tf">

            <div class="tf-name">
              📊 1H
            </div>

            <div class="tf-row">
              <span>Trend</span>
              <strong class="${trendClass(h1.trend)}">
                ${valueOrDash(h1.trend)}
              </strong>
            </div>

            <div class="tf-row">
              <span>RSI</span>
              <strong>
                ${valueOrDash(h1.rsi)}
              </strong>
            </div>

          </div>


          <div class="tf">

            <div class="tf-name">
              📊 5M
            </div>

            <div class="tf-row">
              <span>Trend</span>
              <strong class="${trendClass(m5.trend)}">
                ${valueOrDash(m5.trend)}
              </strong>
            </div>

            <div class="tf-row">
              <span>RSI</span>
              <strong>
                ${valueOrDash(m5.rsi)}
              </strong>
            </div>

          </div>


        </div>

      </div>


      <div class="section">

        <div class="section-title">
          🔎 SMART MONEY CONCEPT / STRUCTURE
        </div>

        <div class="analysis-grid">


          <div class="analysis-item">

            <div class="analysis-label">
              12H SMC
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.h12SMC)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              1H SMC
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.h1SMC)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              5M STRUCTURE
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.structure)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              LOCATION
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.location)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              BOS
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.bos)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              CHoCH
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.choch)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              LIQUIDITY
            </div>

            <div class="analysis-value">
              ${valueOrDash(analysis.liquidity)}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              BREAKOUT
            </div>

            <div class="analysis-value">
              ${analysis.breakout ? "YES" : "NO"}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              REJECTION
            </div>

            <div class="analysis-value">
              ${analysis.rejection ? "YES" : "NO"}
            </div>

          </div>


          <div class="analysis-item">

            <div class="analysis-label">
              EXTENDED
            </div>

            <div class="analysis-value">
              ${analysis.extended ? "YES" : "NO"}
            </div>

          </div>


        </div>

      </div>


      <div class="message">

        <strong>Engine:</strong>
        12H + 1H + 5M

        &nbsp; | &nbsp;

        <strong>Entry TF:</strong>
        5M

        &nbsp; | &nbsp;

        <strong>R:R:</strong>
        1:2

      </div>

    </div>

  `;
}

async function loadDashboard() {

  try {

    const response =
      await fetch(
        "/api/status",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Server returned HTTP " +
        response.status
      );
    }

    const data =
      await response.json();


    /*
    SYSTEM
    */

    const systemStatus =
      document.getElementById(
        "systemStatus"
      );

    systemStatus.textContent =
      data.online
        ? "🟢 ONLINE"
        : "🔴 OFFLINE";


    /*
    MARKET
    */

    const marketStatus =
      document.getElementById(
        "marketStatus"
      );

    marketStatus.textContent =
      data.marketOpen
        ? "🟢 OPEN"
        : "🔴 CLOSED";


    /*
    LAST SCAN
    */

    document.getElementById(
      "lastScan"
    ).textContent =
      formatTime(
        data.lastScan
      );


    /*
    API
    */

    const apiStatus =
      document.getElementById(
        "apiStatus"
      );

    if (
      data.api &&
      data.api.status ===
        "CONFIGURED"
    ) {

      apiStatus.textContent =
        "🟢 CONFIGURED";

    } else {

      apiStatus.textContent =
        "🔴 MISSING";

    }


    /*
    ALERTS
    */

    currentAlerts =
      Boolean(
        data.alerts
      );

    updateAlertButton();


    /*
    PAIRS
    */

    const dashboard =
      document.getElementById(
        "dashboard"
      );

    const pairs =
      data.pairs || {};


    const pairNames =
      Object.keys(pairs);


    if (!pairNames.length) {

      dashboard.innerHTML = `
        <div style="
          text-align:center;
          padding:40px;
          color:#94a3b8;
        ">
          No pairs available.
        </div>
      `;

      return;
    }


    dashboard.innerHTML =
      pairNames
        .map(
          name =>
            renderPair(
              pairs[name]
            )
        )
        .join("");


  } catch (error) {

    console.error(
      error
    );

    document.getElementById(
      "systemStatus"
    ).textContent =
      "🔴 ERROR";

    document.getElementById(
      "dashboard"
    ).innerHTML = `

      <div style="
        background:#111827;
        border:1px solid #7f1d1d;
        border-radius:12px;
        padding:25px;
        margin-top:15px;
        text-align:center;
      ">

        <div style="
          color:#f87171;
          font-weight:bold;
          margin-bottom:8px;
        ">
          Unable to connect to server
        </div>

        <div style="
          color:#94a3b8;
          font-size:13px;
        ">
          ${escapeHtml(error.message)}
        </div>

      </div>

    `;
  }
}


function updateAlertButton() {

  const button =
    document.getElementById(
      "alertButton"
    );

  const text =
    document.getElementById(
      "alertText"
    );

  if (currentAlerts) {

    button.textContent =
      "🔔 ON";

    button.className =
      "toggle toggle-on";

    text.textContent =
      "Telegram signal alerts are enabled.";

  } else {

    button.textContent =
      "🔕 OFF";

    button.className =
      "toggle toggle-off";

    text.textContent =
      "Telegram signal alerts are disabled.";

  }
}


async function toggleAlerts() {

  const newValue =
    !currentAlerts;

  try {

    const response =
      await fetch(
        "/api/alerts",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              enabled:
                newValue
            })
        }
      );

    const data =
      await response.json();

    currentAlerts =
      Boolean(
        data.enabled
      );

    updateAlertButton();

  } catch (error) {

    alert(
      "Unable to change alert setting."
    );

  }
}


/*
=========================================================
AUTO REFRESH
=========================================================
*/

loadDashboard();

/*
Refresh dashboard every 15 seconds.

This does NOT request Twelve Data.
It only reads /api/status.
*/

setInterval(
  loadDashboard,
  15000
);

</script></body>
</html>
