<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trading Cloud Monitor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    header {
      padding: 20px;
      background: #111a2e;
      border-bottom: 1px solid #26324d;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle {
      color: #9ca9c7;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .box {
      background: #111a2e;
      border: 1px solid #26324d;
      border-radius: 12px;
      padding: 16px;
    }

    .label {
      color: #8e9bb8;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }

    .open {
      color: #22c55e;
    }

    .closed {
      color: #f59e0b;
    }

    .error {
      color: #ef4444;
    }

    .pairs {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(330px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111a2e;
      border: 1px solid #26324d;
      border-radius: 14px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .symbol {
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .BUY {
      background: rgba(34,197,94,.15);
      color: #22c55e;
    }

    .SELL {
      background: rgba(239,68,68,.15);
      color: #ef4444;
    }

    .WAIT {
      background: rgba(148,163,184,.15);
      color: #94a3b8;
    }

    .OFFLINE {
      background: rgba(239,68,68,.15);
      color: #ef4444;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .signal-grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .signal-box {
      background: #0b1220;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .signal-box small {
      display: block;
      color: #7f8ba5;
      margin-bottom: 5px;
    }

    .signal-box strong {
      font-size: 13px;
    }

    .trade {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .trade div {
      background: #0b1220;
      padding: 12px 8px;
      border-radius: 8px;
      text-align: center;
    }

    .trade small {
      display: block;
      color: #7f8ba5;
      margin-bottom: 5px;
    }

    .analysis {
      border-top: 1px solid #26324d;
      padding-top: 14px;
    }

    .analysis-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .analysis-row span:first-child {
      color: #8490aa;
    }

    .message {
      margin-top: 12px;
      padding: 11px;
      background: #0b1220;
      border-radius: 8px;
      color: #b8c2d8;
      font-size: 13px;
      line-height: 1.5;
    }

    .warning {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(245,158,11,.1);
      color: #fbbf24;
      font-size: 12px;
      line-height: 1.5;
    }

    .safe {
      background: rgba(34,197,94,.1);
      color: #4ade80;
    }

    .danger {
      background: rgba(239,68,68,.1);
      color: #f87171;
    }

    .footer {
      text-align: center;
      color: #66738e;
      padding: 25px;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .pairs {
        grid-template-columns: 1fr;
      }

      .signal-grid,
      .trade {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Trading Cloud Monitor</h1>
  <div class="subtitle">
    12H + 1H + 5M Multi-Timeframe Trading Engine
  </div>
</header>

<div class="container">

  <div class="topbar">

    <div class="box">
      <div class="label">SYSTEM</div>
      <div id="systemStatus" class="value">
        CONNECTING...
      </div>
    </div>

    <div class="box">
      <div class="label">MARKET</div>
      <div id="marketStatus" class="value">
        CHECKING...
      </div>
    </div>

    <div class="box">
      <div class="label">TIMEFRAME</div>
      <div id="timeframe" class="value">
        5M
      </div>
    </div>

    <div class="box">
      <div class="label">LAST SCAN</div>
      <div id="lastScan" class="value">
        —
      </div>
    </div>

  </div>

  <div id="pairs" class="pairs"></div>

</div>

<div class="footer">
  Trading Cloud Monitor • Signals are for confirmation only
</div>

<script>

const pairsContainer =
  document.getElementById("pairs");

const systemStatus =
  document.getElementById("systemStatus");

const marketStatus =
  document.getElementById("marketStatus");

const timeframe =
  document.getElementById("timeframe");

const lastScan =
  document.getElementById("lastScan");


function escapeHtml(value) {

  if (value === null ||
      value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function trendClass(trend) {

  if (trend === "BULLISH") {
    return "open";
  }

  if (trend === "BEARISH") {
    return "error";
  }

  return "";
}


function formatTime(value) {

  if (!value) {
    return "—";
  }

  try {

    return new Date(value)
      .toLocaleTimeString();

  } catch {

    return value;
  }
}


function renderPair(pair) {

  const tf =
    pair.timeframes || {};

  const h12 =
    tf.h12 || {};

  const h1 =
    tf.h1 || {};

  const m5 =
    tf.m5 || {};

  const analysis =
    pair.analysis || {};

  const status =
    pair.status || "WAIT";

  const extended =
    Boolean(
      analysis.extended
    );

  let warning = "";

  /*
  IMPORTANT:

  If the backend says the move is
  extended, the dashboard clearly
  warns the trader not to chase it.
  */

  if (extended) {

    warning = `
      <div class="warning">
        ⚠️ MOVE EXTENDED — DO NOT CHASE THIS ENTRY.
        Wait for a pullback and fresh 5M confirmation.
      </div>
    `;

  } else if (
    status === "BUY" ||
    status === "SELL"
  ) {

    warning = `
      <div class="warning safe">
        ✅ MULTI-TIMEFRAME SIGNAL.
        Wait for the 5M candle confirmation
        before entering.
      </div>
    `;

  } else {

    warning = `
      <div class="warning">
        ⏳ WAIT — No valid entry confirmation yet.
      </div>
    `;
  }


  return `

    <div class="card">

      <div class="card-header">

        <div class="symbol">
          ${escapeHtml(pair.symbol)}
        </div>

        <div class="status ${status}">
          ${escapeHtml(status)}
        </div>

      </div>


      <div class="price">
        ${pair.price !== null
          ? escapeHtml(pair.price)
          : "—"}
      </div>


      <div class="signal-grid">

        <div class="signal-box">

          <small>12H</small>

          <strong class="${trendClass(h12.trend)}">
            ${escapeHtml(
              h12.trend || "UNKNOWN"
            )}
          </strong>

        </div>


        <div class="signal-box">

          <small>1H</small>

          <strong class="${trendClass(h1.trend)}">
            ${escapeHtml(
              h1.trend || "UNKNOWN"
            )}
          </strong>

        </div>


        <div class="signal-box">

          <small>5M</small>

          <strong class="${trendClass(m5.trend)}">
            ${escapeHtml(
              m5.trend || "UNKNOWN"
            )}
          </strong>

        </div>

      </div>


      <div class="trade">

        <div>
          <small>ENTRY</small>
          <strong>
            ${pair.entry !== null
              ? escapeHtml(pair.entry)
              : "—"}
          </strong>
        </div>

        <div>
          <small>STOP LOSS</small>
          <strong>
            ${pair.stopLoss !== null
              ? escapeHtml(pair.stopLoss)
              : "—"}
          </strong>
        </div>

        <div>
          <small>TAKE PROFIT</small>
          <strong>
            ${pair.takeProfit !== null
              ? escapeHtml(pair.takeProfit)
              : "—"}
          </strong>
        </div>

      </div>


      <div class="analysis">

        <div class="analysis-row">
          <span>Score</span>
          <strong>
            ${escapeHtml(pair.score)}/5
          </strong>
        </div>


        <div class="analysis-row">
          <span>12H RSI</span>
          <strong>
            ${h12.rsi ?? "—"}
          </strong>
        </div>


        <div class="analysis-row">
          <span>1H RSI</span>
          <strong>
            ${h1.rsi ?? "—"}
          </strong>
        </div>


        <div class="analysis-row">
          <span>5M RSI</span>
          <strong>
            ${m5.rsi ?? "—"}
          </strong>
        </div>


        <div class="analysis-row">
          <span>SMC</span>
          <strong>
            ${escapeHtml(
              analysis.location || "—"
            )}
          </strong>
        </div>


        <div class="analysis-row">
          <span>Structure</span>
          <strong>
            ${escapeHtml(
              analysis.structure || "—"
            )}
          </strong>
        </div>


        <div class="analysis-row">
          <span>BOS</span>
          <strong>
            ${escapeHtml(
              analysis.bos || "—"
            )}
          </strong>
        </div>


        <div class="analysis-row">
          <span>CHoCH</span>
          <strong>
            ${escapeHtml(
              analysis.choch || "—"
            )}
          </strong>
        </div>


        <div class="analysis-row">
          <span>Liquidity</span>
          <strong>
            ${escapeHtml(
              analysis.liquidity || "—"
            )}
          </strong>
        </div>


        <div class="analysis-row">
          <span>Breakout</span>
          <strong>
            ${analysis.breakout
              ? "YES"
              : "NO"}
          </strong>
        </div>


        <div class="analysis-row">
          <span>Rejection</span>
          <strong>
            ${analysis.rejection
              ? "YES"
              : "NO"}
          </strong>
        </div>


        <div class="analysis-row">
          <span>Extended</span>
          <strong class="${extended
            ? "error"
            : "open"}">
            ${extended
              ? "YES"
              : "NO"}
          </strong>
        </div>

      </div>


      <div class="message">
        ${escapeHtml(
          pair.message ||
          "Waiting for analysis..."
        )}
      </div>


      ${warning}


      <div style="
        margin-top:10px;
        color:#66738e;
        font-size:11px;
      ">
        Updated:
        ${formatTime(pair.updated)}
      </div>

    </div>

  `;
}


async function loadStatus() {

  try {

    const response =
      await fetch(
        "/api/status",
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Server response error"
      );
    }

    const data =
      await response.json();


    /*
    SYSTEM
    */

    systemStatus.textContent =
      data.online
        ? "ONLINE"
        : "OFFLINE";

    systemStatus.className =
      "value " +
      (
        data.online
          ? "open"
          : "error"
      );


    /*
    MARKET
    */

    marketStatus.textContent =
      data.marketStatus ||
      (
        data.marketOpen
          ? "OPEN"
          : "CLOSED"
      );

    marketStatus.className =
      "value " +
      (
        data.marketOpen
          ? "open"
          : "closed"
      );


    /*
    TIMEFRAME
    */

    timeframe.textContent =
      data.timeframe ||
      "5M";


    /*
    LAST SCAN
    */

    lastScan.textContent =
      formatTime(
        data.lastScan
      );


    /*
    PAIRS
    */

    const pairs =
      data.pairs || {};


    const html =
      Object.keys(pairs)
        .map(
          key =>
            renderPair(
              pairs[key]
            )
        )
        .join("");


    pairsContainer.innerHTML =
      html ||
      `
        <div class="box">
          Waiting for pair data...
        </div>
      `;


  } catch (error) {

    systemStatus.textContent =
      "OFFLINE";

    systemStatus.className =
      "value error";

    pairsContainer.innerHTML = `

      <div class="box">

        <strong>
          Unable to connect to trading server.
        </strong>

        <div style="
          margin-top:8px;
          color:#8e9bb8;
        ">
          ${escapeHtml(
            error.message
          )}
        </div>

      </div>

    `;
  }
}


/*
Initial load
*/

loadStatus();


/*
Refresh dashboard every 15 seconds.

This does NOT request Twelve Data.
It only reads /api/status.
*/

setInterval(
  loadStatus,
  15000
);

</script>

</body>
</html>
